name: datamuncher
description: DataMuncher — DAT-27 Garbage Bin Viewer and DAT-28 Garbage Bin Empty, on the photo-library app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.0.0          # 3.x includes editor.android.moveToTrash
  photo_manager_image_provider: ^2.1.0
  image: ^4.2.0
  shared_preferences: ^2.3.0
  disk_space_plus: ^0.2.3
  path: ^1.9.0
  scan_engine_flutter:           # DAT-1 scan engine + Android/iOS device adapters
    path: ../packages/scan_engine_flutter
  file_picker: ^10.3.0           # DAT-17 garbage storage, DAT-18 folder scan (8.x targets API 34, too old)
  archive: ^4.0.0                # DAT-17 compression (4.x, the line image uses)
  crypto: ^3.0.3                 # DAT-16 duplicate hashing

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
