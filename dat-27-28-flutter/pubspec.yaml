name: datamuncher
description: DataMuncher photo-library app — Garbage Bin (DAT-27, DAT-28), unused apps (DAT-25), Do not collect (DAT-32), free with ads (DAT-38) and ad-free subscription (DAT-39).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.0.0          # 3.x includes editor.android.moveToTrash
  photo_manager_image_provider: ^2.1.0
  image: ^4.2.0
  shared_preferences: ^2.3.0
  disk_space_plus: ^0.2.5           # 0.2.5+ uses DiskSpacePlus() instances
  # DAT-38 ads and DAT-39 subscription. Wide ranges so `flutter pub get`
  # picks the newest version that works with your Flutter.
  google_mobile_ads: ">=5.1.0 <10.0.0"
  in_app_purchase: ">=3.1.13 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
